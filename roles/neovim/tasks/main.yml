---
- name: Download neovim
  unarchive:
    src: "{{ nvim_releases_url }}/{{ nvim_version }}/{{ nvim_tarball }}"
    dest: "{{ tools_dir }}"
    remote_src: true
    creates: "{{ tools_dir }}/{{ nvim_bin }}/nvim"

- name: Install neovim symlink
  file:
    src: "{{ tools_dir }}/{{ nvim_bin }}/nvim"
    dest: "{{ tools_bin }}/nvim"
    state: link

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ nvim_cfg }}"
    - "{{ nvim_packpath }}"

    #- name: Setup config files
    #copy:
    #src: ./
    #dest: "{{ nvim_cfg }}"

- name: Install nvim-lspconfig
  git:
    repo: "https://github.com/neovim/nvim-lspconfig.git"
    dest: "{{ nvim_packpath }}/lsp/opt/nvim-lspconfig"

- name: Install language servers
  become: true
  apt:
    state: latest
    pkg:
      - clangd
      - gopls

- name: Install Python language server
  command:
    cmd: pip install --user jedi-language-server
    creates: "{{ ansible_env.HOME }}/.local/bin/jedi-language-server"
