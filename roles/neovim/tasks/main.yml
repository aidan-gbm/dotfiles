---
- name: Install git
  become: true
  apt:
    name: git
    state: latest

- name: Download neovim
  unarchive:
    src: "{{ nvim_releases_url }}/{{ nvim_version }}/{{ nvim_tarball }}"
    dest: "{{ tools_dir }}"
    remote_src: true
    creates: "{{ tools_dir }}/{{ nvim_bin }}/nvim"

- name: Install neovim symlink
  file:
    src: "{{ tools_dir }}/{{ nvim_bin }}/nvim"
    dest: "{{ local_bin }}/nvim"
    state: link

- name: Create config directory
  file:
    path: "{{ nvim_cfg }}"
    state: directory

- name: Setup config files
  copy:
    src: ./
    dest: "{{ nvim_cfg }}"

- name: Install clangd
  become: true
  apt:
    state: latest
    name: clangd

- name: Install jedi-language-server
  command:
    cmd: pip install --upgrade --user jedi-language-server
    creates: "{{ ansible_env.HOME }}/.local/bin/jedi-language-server"
